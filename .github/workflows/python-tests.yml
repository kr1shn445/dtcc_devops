name: Python Ingestion CI

on:
  push:
    branches: [main]
    paths:
      - 'Intelligent-Data-Ingestion/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Intelligent-Data-Ingestion/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Intelligent-Data-Ingestion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run offline validation tests
        run: |
          pytest -v \
            test_checksum.py \
            test_schema.py \
            test_business_rules.py \
            test_duplicates.py \
            test_manifest.py \
            test_batch_metadata.py \
            test_csv_processing.py \
            test_routing.py \
            tests/test_validation.py